{% extends "base.html" %}
{% block title %}Join {{ league_name }}{% endblock %}

{% block content %}
<div class="card" style="max-width:380px;margin:60px auto">
  <div class="card-hd">🔒 {{ league_name }}</div>
  <div class="card-body">
    <p style="font-size:.88rem;color:#666;margin-bottom:16px">
      This league is password-protected. Enter the join password to continue.
    </p>
    <form method="post">
      <div class="form-row">
        <label for="pw">Join password</label>
        <input type="password" name="password" id="pw" autofocus placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-green" style="width:100%;margin-top:6px">Enter League</button>
    </form>
    <div style="margin-top:14px;text-align:center">
      <a href="{{ url_for('lobby') }}" style="font-size:.82rem;color:#888">← Back to lobby</a>
    </div>
  </div>
</div>
{% endblock %}
