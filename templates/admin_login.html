{% extends "base.html" %}
{% block title %}Admin Login – {{ league_name }}{% endblock %}

{% block content %}
<div class="card" style="max-width:380px;margin:40px auto">
  <div class="card-hd">Admin Login — {{ league_name }}</div>
  <div class="card-body">
    <form method="post">
      <div class="form-row">
        <label for="pw">Admin password</label>
        <input type="password" name="password" id="pw" autofocus placeholder="Enter admin password">
      </div>
      <button type="submit" class="btn btn-green" style="width:100%;margin-top:6px">Login</button>
    </form>
    <div style="margin-top:14px;text-align:center">
      <a href="{{ url_for('league_index', code=code) }}" style="font-size:.82rem;color:#888">← Back to scoreboard</a>
    </div>
  </div>
</div>
{% endblock %}
